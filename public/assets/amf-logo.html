<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMF Logo</title>
  <style>
    :root {
      --bar-width: 28px;
      --gap: 4px;
      --black: #11100f;
      --white: #fbfbf9;
      --font-family:
        -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue",
        Helvetica, Arial, sans-serif;
      --text-size: 14px;
      --text-spacing: -0.01em;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .logo-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 6px 0 0;
    }

    .logo-container {
      width: min(100%, 204px);
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .logo-elements {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: var(--gap);
      min-height: 116px;
    }

    .logo-a .circle {
      width: var(--bar-width);
      height: var(--bar-width);
      background: rgba(208, 200, 190, 0.98);
      color: var(--black);
      font: 700 15px var(--font-family);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: rotateKnob 6s linear infinite;
      transform-origin: center;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.88),
        inset 0 -1px 0 rgba(194, 184, 171, 0.24);
    }

    .logo-a .circle::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 3px;
      background:
        conic-gradient(
          from 315deg,
          transparent 0 24%,
          rgba(146, 140, 132, 0.8) 24% 74%,
          transparent 74% 100%
        );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .logo-a .circle::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: calc(50% - 3px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(244, 239, 232, 0.95) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.88),
        inset 0 -1px 0 rgba(194, 184, 171, 0.18);
      pointer-events: none;
    }

    .logo-a .circle span {
      position: relative;
      z-index: 2;
    }

    .rounded-bar {
      width: var(--bar-width);
      border-radius: calc(var(--bar-width) / 2);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(208, 200, 190, 0.98);
    }

    .rounded-bar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 3px;
      background:
        conic-gradient(
          from 315deg,
          transparent 0 24%,
          rgba(146, 140, 132, 0.8) 24% 74%,
          transparent 74% 100%
        );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .rounded-bar::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: calc((var(--bar-width) / 2) - 3px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(244, 239, 232, 0.95) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.88),
        inset 0 -1px 0 rgba(194, 184, 171, 0.18);
      pointer-events: none;
    }

    .bar-m {
      height: 72px;
    }

    .bar-f {
      height: 112px;
    }

    .rounded-bar .letter {
      width: var(--bar-width);
      height: var(--bar-width);
      background: var(--black);
      color: var(--white);
      font: 700 15px var(--font-family);
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .bar-m .letter {
      animation: sliderUpDown 6s ease-in-out infinite alternate;
    }

    .bar-f .letter {
      animation: sliderDownUp 6.5s ease-in-out infinite alternate;
    }

    .logo-text {
      width: 100%;
      margin-top: 6px;
      color: var(--black);
      font-family: var(--font-family);
      font-size: var(--text-size);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: var(--text-spacing);
      line-height: 0.95;
      text-align: center;
      white-space: nowrap;
    }

    @keyframes sliderUpDown {
      0%, 100% { bottom: 0; }
      50% { bottom: 60%; }
    }

    @keyframes sliderDownUp {
      0%, 100% { bottom: 60%; }
      50% { bottom: 0; }
    }

    @keyframes rotateKnob {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 140px) {
      :root {
        --bar-width: 26px;
        --text-size: 13px;
      }

      .logo-elements {
        min-height: 102px;
      }

      .bar-m {
        height: 64px;
      }

      .bar-f {
        height: 96px;
      }
    }

    @media (max-width: 110px) {
      :root {
        --bar-width: 22px;
        --text-size: 11px;
        --text-spacing: -0.01em;
      }

      .logo-elements {
        min-height: 82px;
        gap: 4px;
      }

      .bar-m {
        height: 52px;
      }

      .bar-f {
        height: 78px;
      }

      .logo-a .circle,
      .rounded-bar .letter {
        font-size: 13px;
      }
    }

  </style>
</head>
<body>
  <div class="logo-wrapper">
    <div class="logo-container">
      <div class="logo-elements">
        <div class="logo-a">
          <div class="circle"><span>A</span></div>
        </div>
        <div class="rounded-bar bar-m">
          <div class="letter">M</div>
        </div>
        <div class="rounded-bar bar-f">
          <div class="letter">F</div>
        </div>
      </div>
      <div class="logo-text">ALL MY FRIENDS</div>
    </div>
  </div>
</body>
</html>
